<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter Drop Shadow Halus -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Kelopak Kiri -->
    <path d="M 235 440 C 130 405 50 295 85 110 C 155 105 225 210 235 440 Z" 
          fill="#4ba3e3" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

    <!-- Kelopak Kanan -->
    <path d="M 265 440 C 370 405 450 295 415 110 C 345 105 275 210 265 440 Z" 
          fill="#4ba3e3" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

    <!-- Kelopak Tengah (Utama) -->
    <path d="M 250 450 C 185 300 160 170 250 50 C 340 170 315 300 250 450 Z" 
          fill="#4ba3e3" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
  </g>
</svg>
